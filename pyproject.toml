[project]
name = "grader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["redis>=5", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["grader", "grader.sandbox"]

[tool.setuptools.package-data]
grader = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
